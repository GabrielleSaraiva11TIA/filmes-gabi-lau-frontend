<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar filme | Gabrielle e Laura Tavares</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="pagina-form">
    <header class="topo">
        <a class="voltar" href="../index.html">Voltar para a lista</a>
        <h1>Editar filme</h1>
    </header>

    <main>
        <form class="formulario" id="formulario" novalidate>
            <div class="campo largo">
                <label for="title">Título</label>
                <input type="text" id="title" autocomplete="off" required>
            </div>

            <div class="campo largo">
                <label for="gender">Gênero</label>
                <input type="text" id="gender" list="generos" autocomplete="off" required>
                <datalist id="generos">
                    <option value="Ação">
                    <option value="Animação">
                    <option value="Aventura">
                    <option value="Comédia">
                    <option value="Drama">
                    <option value="Fantasia">
                    <option value="Ficção Científica">
                    <option value="Romance">
                    <option value="Suspense">
                    <option value="Terror">
                </datalist>
            </div>

            <div class="campo">
                <label for="duration">Duração (minutos)</label>
                <input type="number" id="duration" min="1" inputmode="numeric" required>
            </div>

            <div class="campo">
                <label for="ageLimit">Classificação indicativa</label>
                <select id="ageLimit" required>
                    <option value="">Escolha</option>
                    <option value="Livre">Livre</option>
                    <option value="10 anos">10 anos</option>
                    <option value="12 anos">12 anos</option>
                    <option value="14 anos">14 anos</option>
                    <option value="16 anos">16 anos</option>
                    <option value="18 anos">18 anos</option>
                </select>
            </div>

            <p class="erro" id="erro" role="alert"></p>

            <div class="rodape-form">
                <button class="botao" type="submit" id="enviar" disabled>Salvar alterações</button>
                <a href="../index.html">Cancelar</a>
            </div>
        </form>
    </main>

    <script src="editar.js"></script>
</body>
</html>
